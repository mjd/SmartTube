name: Build Debug APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.SIGNING_KEY != '' }}
      HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Update Version Name
        id: get_version
        run: |
          # Keep the original code to make the nightly and original builds interchangeable
          sed -i "s/versionName \"\(.*\)\"/versionName \"\1-nightly-${{ github.run_number }}\"/" smarttubetv/build.gradle
          echo "VERSION_NAME=$(grep "versionName" smarttubetv/build.gradle | head -n 1 | awk -F'"' '{print $2}')" >> $GITHUB_OUTPUT

      - name: Configure Build Signing
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks
    
      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Guard against new reflection into player internals
        # Reflective field pokes into ExoPlayer internals fail silently rather than at compile
        # time: they survive a player upgrade looking healthy and then break at runtime. 32 such
        # sites exist today (LiveDashManifestParser 26, DelayMediaCodecAudioRenderer 5,
        # TrackErrorFixer 1) and are scheduled for removal. This is a ratchet, not a ban -- it
        # blocks new ones and should be lowered as the existing ones go.
        env:
          REFLECTION_BASELINE: 31
        run: |
          COUNT=$(grep -rn -E 'Helpers\.(get|set)Field' --include='*.java' \
                    common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/ | wc -l | tr -d ' ')
          echo "Reflection sites: $COUNT (baseline $REFLECTION_BASELINE)"
          if [ "$COUNT" -gt "$REFLECTION_BASELINE" ]; then
            grep -rn -E 'Helpers\.(get|set)Field' --include='*.java' \
              common/src/main/java/com/liskovsoft/smartyoutubetv2/common/exoplayer/
            echo "::error::New reflection into player internals ($COUNT > $REFLECTION_BASELINE)."
            exit 1
          fi
          if [ "$COUNT" -lt "$REFLECTION_BASELINE" ]; then
            echo "::notice::Reflection sites reduced to $COUNT -- lower REFLECTION_BASELINE."
          fi

      - name: Unit Tests
        # Scoped to the plain-JUnit suites on purpose. A bare './gradlew test' also runs the
        # legacy Robolectric suites, which cannot start under the JDK 17 this build requires
        # (ASM cannot read modern class files) and would fail for reasons unrelated to the code.
        #
        # The ':exoplayer-library-core' suite that used to run here is gone: the vendored player is
        # no longer part of the build, so the task no longer exists and the step failed outright.
        # ':sabr' replaces it as the second module with tests of its own.
        run: |
          ./gradlew :common:testStbetaDebugUnitTest
          ./gradlew :sabr:testStbetaDebugUnitTest

      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-report
          path: '**/build/reports/tests/**'
          if-no-files-found: warn

      - name: Lint with Gradle
        run: ./gradlew lintStbetaRelease

      - name: Upload Lint Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lint-report
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

      - name: Build with Gradle
        run: ./gradlew clean assembleStbetaRelease

      - name: VirusTotal Scan
        if: ${{ env.HAS_VT_KEY == 'true' }}
        id: vt
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
          files: |
            ./smarttubetv/build/outputs/apk/stbeta/release/*.apk
          request_rate: 4

      - name: VirusTotal Summary
        if: steps.vt.outcome == 'success'
        run: |
          echo "Waiting 150s for VirusTotal engines to report..."
          sleep 150

          echo "### Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | VirusTotal Status | Detailed Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          for apk in ./smarttubetv/build/outputs/apk/stbeta/release/*.apk; do
            filename=$(basename "$apk")
            sha256=$(sha256sum "$apk" | awk '{print $1}')

            # Construct the dynamic badge URL using the hash
            badge_url="https://badges.cssnr.com/vt/id/$sha256?start=green&end=red&n=8"
            vt_link="https://www.virustotal.com/gui/file/$sha256"

            echo "| $filename | [![$filename]($badge_url)]($vt_link) | [View Report]($vt_link) |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_arm64
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_armeabi-v7a
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_universal
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_universal.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_${{ steps.get_version.outputs.VERSION_NAME }}_x86
          path: ./smarttubetv/build/outputs/apk/stbeta/release/*_x86.apk
          if-no-files-found: error
